<ol class="feed">
  @for (row of rows(); track row.id) {
    <li>
      <span class="avatar" aria-hidden="true">{{ row.user.avatar }}</span>
      <div>
        <p>
          <strong>{{ row.user.name }}</strong> {{ row.message }}
        </p>
        <time [attr.datetime]="row.createdAt" [title]="row.createdAt | date: 'medium'">{{
          row.when
        }}</time>
      </div>
    </li>
  } @empty {
    <li class="empty">{{ 'activity.empty' | translate }}</li>
  }
</ol>
