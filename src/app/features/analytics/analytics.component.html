<h1>Analytics</h1>

@if (tasksResource.isLoading()) {
  <div class="grid">
    <div class="skeleton" aria-hidden="true"></div>
    <div class="skeleton" aria-hidden="true"></div>
  </div>
} @else if (tasksResource.error()) {
  <app-error-state message="Couldn't load task analytics." (retry)="tasksResource.reload()" />
} @else if (tasks().length === 0) {
  <p class="empty">There are no tasks to analyze yet.</p>
} @else {
  <div class="grid">
    <app-chart-card
      title="Tasks by priority"
      [config]="priorityConfig()"
      [slices]="prioritySlicesList()"
    />
    <app-chart-card
      title="Tasks by status"
      [config]="statusConfig()"
      [slices]="statusSlicesList()"
    />
  </div>
}
