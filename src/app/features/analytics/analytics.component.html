<h1>{{ 'analytics.title' | translate }}</h1>

@if (tasksResource.isLoading()) {
  <div class="grid">
    <div class="skeleton" aria-hidden="true"></div>
    <div class="skeleton" aria-hidden="true"></div>
  </div>
} @else if (tasksResource.error()) {
  <app-error-state [message]="'analytics.error' | translate" (retry)="tasksResource.reload()" />
} @else if (tasks().length === 0) {
  <p class="empty">{{ 'analytics.empty' | translate }}</p>
} @else {
  <div class="grid">
    <app-chart-card
      [title]="'analytics.byPriority' | translate"
      [config]="priorityConfig()"
      [slices]="prioritySlicesList()"
    />
    <app-chart-card
      [title]="'analytics.byStatus' | translate"
      [config]="statusConfig()"
      [slices]="statusSlicesList()"
    />
  </div>
}
