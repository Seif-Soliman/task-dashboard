<section class="bar" [attr.aria-label]="'dashboard.filters.label' | translate">
  <div class="tabs" role="group" [attr.aria-label]="'dashboard.filters.byStatus' | translate">
    @for (option of statusOptions; track option.value) {
      <button
        type="button"
        class="tab"
        [class.selected]="filters().status === option.value"
        [attr.aria-pressed]="filters().status === option.value"
        (click)="filtersChange.emit({ status: option.value })"
      >
        {{ option.label }}
      </button>
    }
  </div>

  <div class="actions">
    @if (isFiltered()) {
      <button mat-button type="button" (click)="clear.emit()">
        {{ 'dashboard.filters.clear' | translate }}
      </button>
    }
    <app-filter-menu
      [label]="priorityLabel"
      [options]="priorityOptions"
      [value]="filters().priority"
      (valueChange)="filtersChange.emit({ priority: $event })"
    />
    <app-filter-menu
      [label]="assigneeLabel"
      [options]="assigneeOptions()"
      [value]="filters().assignee"
      (valueChange)="filtersChange.emit({ assignee: $event })"
    />
    <button mat-flat-button type="button" (click)="newTask.emit()">
      {{ 'common.newTask' | translate }}
    </button>
  </div>
</section>
