<section class="column" [attr.aria-labelledby]="'board-col-' + status()">
  <header>
    <h2 [id]="'board-col-' + status()">{{ title() }}</h2>
    <span class="count" [attr.aria-label]="countLabel()">{{ tasks().length }}</span>
  </header>

  <ul class="cards" cdkDropList [cdkDropListData]="status()" (cdkDropListDropped)="onDrop($event)">
    @for (task of tasks(); track task.id) {
      <li cdkDrag [cdkDragData]="task" [cdkDragStartDelay]="dragStartDelay">
        <app-task-card
          [task]="task"
          (edit)="edit.emit($event)"
          (remove)="remove.emit($event)"
          (moveTo)="moveTo.emit({ task, status: $event })"
        />
      </li>
    } @empty {
      <li class="empty">{{ 'dashboard.board.empty' | translate }}</li>
    }
  </ul>
</section>
