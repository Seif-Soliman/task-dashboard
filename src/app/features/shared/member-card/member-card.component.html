<article class="member">
  <span class="avatar" aria-hidden="true">{{ member().user.avatar }}</span>
  <div class="info">
    <h3>{{ member().user.name }}</h3>
    <a class="email" [href]="'mailto:' + member().user.email">{{ member().user.email }}</a>
    <ul class="stats">
      <li>{{ member().open }} open</li>
      <li>{{ member().done }} done</li>
      <li [class.alert]="member().overdue > 0">{{ member().overdue }} overdue</li>
    </ul>
  </div>
  <a
    mat-stroked-button
    routerLink="/dashboard"
    [queryParams]="{ assignee: member().user.id }"
    [attr.aria-label]="'View tasks assigned to ' + member().user.name"
  >
    View tasks
  </a>
</article>
